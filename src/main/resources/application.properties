# Defaults to an in-memory H2 database so the app runs out of the box.
# Set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, and DB_DIALECT for MySQL or another database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:booklibrary}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mvc.contentnegotiation.defaultContentType=text/html