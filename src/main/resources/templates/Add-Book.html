<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a book to your personal library.">
    <title>BookShelf — Add a Book</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="page-shell">
    <header class="site-header">
        <a class="brand" th:href="@{/books}" aria-label="BookShelf home">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span><strong class="brand-title">BookShelf</strong><small class="brand-subtitle">Your reading, beautifully organized.</small></span>
        </a>
        <a class="button secondary" th:href="@{/books}">Back to shelf</a>
    </header>
    <section class="form-wrap">
        <div class="form-card">
            <p class="eyebrow">New collection</p>
            <h1>Add a book</h1>
            <p class="form-intro">Capture the details now, and keep the story easy to revisit later.</p>
            <form class="book-form" data-book-form th:action="@{/books/add}" th:object="${book}" method="post" novalidate>
                <div class="field-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error' : ''">
                    <label for="name">Book name <span aria-hidden="true">*</span></label>
                    <input id="name" type="text" th:field="*{name}" required maxlength="120" autocomplete="off" placeholder="e.g. The Midnight Library" th:aria-invalid="${#fields.hasErrors('name')}">
                    <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div class="field-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error' : ''">
                    <label for="description">Description <span aria-hidden="true">*</span></label>
                    <textarea id="description" th:field="*{description}" required maxlength="1000" placeholder="What makes this book worth remembering?"></textarea>
                    <p class="field-help">Keep it under 1000 characters.</p>
                    <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                </div>
                <div class="field-group" th:classappend="${#fields.hasErrors('imageName')} ? 'has-error' : ''">
                    <label for="imageName">Cover image URL <span class="field-help">(optional)</span></label>
                    <input id="imageName" type="url" th:field="*{imageName}" maxlength="500" placeholder="https://example.com/cover.jpg" th:aria-invalid="${#fields.hasErrors('imageName')}">
                    <p class="field-error" th:if="${#fields.hasErrors('imageName')}" th:errors="*{imageName}"></p>
                    <div class="preview" id="imagePreviewWrap" hidden><span class="preview-label">Image preview</span><img id="imagePreview" alt="Cover preview"></div>
                </div>
                <div class="field-group" th:classappend="${#fields.hasErrors('videoUrl')} ? 'has-error' : ''">
                    <label for="videoUrl">Video URL <span class="field-help">(optional)</span></label>
                    <input id="videoUrl" type="url" th:field="*{videoUrl}" maxlength="500" placeholder="https://example.com/trailer.mp4" th:aria-invalid="${#fields.hasErrors('videoUrl')}">
                    <p class="field-error" th:if="${#fields.hasErrors('videoUrl')}" th:errors="*{videoUrl}"></p>
                    <div class="preview" id="videoPreviewWrap" hidden><span class="preview-label">Video preview</span><video id="videoPreview" controls></video></div>
                </div>
                <div class="form-actions">
                    <a class="button secondary" th:href="@{/books}">Cancel</a>
                    <button class="button" type="submit">Save book</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
